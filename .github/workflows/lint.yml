name: checks
on:
    pull_request:
    workflow_dispatch:
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: ./.github/actions/setup-python
            - run: |
                  uv run ruff check --fix
                  uv run ruff format

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: ./.github/actions/setup-python
            - run: uv run ty check

    vulture:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: ./.github/actions/setup-python
            - run: uv run vulture --min-confidence 100 --exclude ".venv" .
