---
# Built-in theme: Catppuccin (Latte = light, Mocha = dark).
# This is the default theme.
# Palette derived from Catppuccin, Copyright (c) 2021 Catppuccin, MIT.
# Token keys drop the --kk- prefix. See docs/themes/tokens.md.
default_mode: dark
font_url: "https://iosevka-webfonts.github.io/iosevka/Iosevka.css"

font: "'Iosevka Web', monospace"
font-size: "16px"
line-height: "1.6"
radius: "6px"
gap: "12px"
section-gap: "15px"
key-size: "50px"
max-width: "1200px"

light: # Catppuccin Latte
    bg: "#eff1f5"
    surface: "#e6e9ef"
    card: "#dce0e8"
    card-hover: "#bcc0cc"
    key-bg: "#dce0e8"
    keyboard-bg: "#dce0e8"
    border: "#9ca0b0"
    border-input: "#acb0be"
    text: "#4c4f69"
    text-muted: "#5c5f77"
    accent: "#8839ef"
    accent-2: "#7287fd"
    key-text: "#8839ef"
    step-1: "#40a02b"
    step-2: "#209fb5"
    step-3: "#fe640b"
    step-4: "#8839ef"
    step-5: "#7287fd"
    step-overflow: "#df8e1d"
    step-text: "#eff1f5"
    shadow: "rgba(0, 0, 0, 0.1)"
    shadow-strong: "rgba(0, 0, 0, 0.15)"

dark: # Catppuccin Mocha
    bg: "#1e1e2e"
    surface: "#313244"
    card: "#45475a"
    card-hover: "#585b70"
    key-bg: "#313244"
    keyboard-bg: "#11111b"
    border: "#6c7086"
    border-input: "#585b70"
    text: "#cdd6f4"
    text-muted: "#bac2de"
    accent: "#cba6f7"
    accent-2: "#b4befe"
    key-text: "#f38ba8"
    step-1: "#a6e3a1"
    step-2: "#74c7ec"
    step-3: "#fab387"
    step-4: "#cba6f7"
    step-5: "#b4befe"
    step-overflow: "#f9e2af"
    step-text: "#1e1e2e"
    shadow: "rgba(0, 0, 0, 0.3)"
    shadow-strong: "rgba(0, 0, 0, 0.4)"
