[project]
name = "koalakeys"
version = "0.6.0"
description = "Build interactive, portable cheatsheets from YAML."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["jinja2>=3.1.6", "python-dotenv>=1.1.1", "ruamel-yaml>=0.18.14"]

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "prek>=0.3.6",
  "pytest>=8.4.2",
  "pytest-cov>=7.1.0",
  "ruff>=0.14.0",
  "ty>=0.0.1a22",
  "vulture>=2.14",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
indent-width = 4
line-length = 120

[tool.ruff.lint]
ignore = [
  "ANN",  # flake8-annotations
  "COM",  # flake8-commas
  "DJ",  # django
  "EXE",  # flake8-executable
  "BLE",  # blind except
  "PTH",  # flake8-pathlib
  "T10",  # debugger
  "TID",  # flake8-tidy-imports
  "D100",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D101",
  "D107",  # missing docstring in public module
  "D102",  # missing docstring in public class
  "D104",  # missing docstring in public package
  "D213",
  "D203",
  "D400",
  "D415",
  "G004",
  "PLR2004",
  "E501",  # line too long
  "TRY",
  "SIM105",  # faster without contextlib
]
extend-select = [
  "F",  # Pyflakes rules
  "W",  # PyCodeStyle warnings
  "E",  # PyCodeStyle errors
  "I",  # Sort imports properly
  "UP",  # Warn if certain things can changed due to newer Python versions
  "C4",  # Catch incorrect use of comprehensions, dict, list, etc
  "FA",  # Enforce from __future__ import annotations
  "ISC",  # Good use of string concatenation
  "ICN",  # Use common import conventions
  "RET",  # Good return practices
  "SIM",  # Common simplification rules
  "TID",  # Some good import practices
  "TC",  # Enforce importing certain types in a TYPE_CHECKING block
  "PTH",  # Use pathlib instead of os.path
  "TD",  # Be diligent with TODO comments
  "C90",
]
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false
